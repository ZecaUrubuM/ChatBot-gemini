# =============================================================================
# Aplicação
# =============================================================================
spring.application.name=chatbot-gemini
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- H2 em memória ---
spring.datasource.url=jdbc:h2:mem:supermercado;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update cria a tabela produtos a partir de Produto.java
# defer + init.mode=always garante que data.sql rode DEPOIS do schema
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Gemini via endpoint OpenAI-compatible (Google AI Studio) ---
# NÃO commite a chave. Defina GEMINI_API_KEY no ambiente / Run Configuration.
#
# gemini-3.6-flash (obrigatório para contas novas):
#   NÃO envie temperature / top_p / max_tokens / frequency_penalty / presence_penalty
#   NÃO envie thinking_budget (é da geração 2.5; no 3.x vira 400)
#   NÃO envie reasoning_effort=none (thinking NÃO desliga; @Tool exige thought_signature)
# O round-trip de thought_signature é feito em ThoughtSignatureHttpClient.
# timeout/max-retries são do cliente HTTP, não vão no JSON.
langchain4j.open-ai.chat-model.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
langchain4j.open-ai.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.open-ai.chat-model.model-name=${GEMINI_MODEL_NAME:gemini-3.6-flash}
langchain4j.open-ai.chat-model.timeout=${GEMINI_TIMEOUT:60s}
langchain4j.open-ai.chat-model.max-retries=${GEMINI_MAX_RETRIES:3}
# Liga o dump do JSON enviado à Google. Desligue depois de validar o chat.
langchain4j.open-ai.chat-model.log-requests=${GEMINI_LOG_REQUESTS:true}
langchain4j.open-ai.chat-model.log-responses=${GEMINI_LOG_RESPONSES:true}

# Impede o AutoConfig do starter de montar um segundo OpenAiChatModel
# (ele faria .temperature() / .reasoningEffort() e voltaria o 400).
spring.autoconfigure.exclude=dev.langchain4j.openai.spring.AutoConfig

# Memória por sessionId (usado no @MemoryId).
# GeminiCompatibleChatMemory evicta o turno completo de function calling
# (user + tool_call + tool_result + resposta), não mensagens isoladas.
chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}

# =============================================================================
# Jackson
# =============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.com.chatbot=DEBUG
logging.level.dev.langchain4j=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# CORS (ajuste as origens em produção)
# Origens aplicadas por CorsConfig. localhost e 127.0.0.1 são origens distintas.
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:5500}

