# =============================================================================
# Aplicação
# =============================================================================
spring.application.name=chatbot-gemini
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- H2 em memória ---
spring.datasource.url=jdbc:h2:mem:supermercado;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update cria a tabela produtos a partir de Produto.java
# defer + init.mode=always garante que data.sql rode DEPOIS do schema
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Gemini (Google AI Studio) ---
# NÃO commite a chave. Defina GEMINI_API_KEY no ambiente / Run Configuration.
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=${GEMINI_MODEL_NAME:gemini-1.5-flash}
langchain4j.google-ai-gemini.chat-model.temperature=${GEMINI_TEMPERATURE:0.2}
langchain4j.google-ai-gemini.chat-model.timeout=${GEMINI_TIMEOUT:60s}
langchain4j.google-ai-gemini.chat-model.max-retries=${GEMINI_MAX_RETRIES:3}

# Memória por sessionId (usado no @MemoryId)
chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}

# =============================================================================
# Jackson
# =============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.com.chatbot=DEBUG
logging.level.dev.langchain4j=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# CORS (ajuste as origens em produção)
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

